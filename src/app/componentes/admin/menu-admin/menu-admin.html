<div class="contenedor-admin">
    <h1 class="admin__title">Administración</h1>

    @for (grupo of grupos; track grupo.titulo) {
        <section class="admin__grupo">
            <h2 class="admin__grupo-titulo">{{ grupo.titulo }}</h2>
            <ul class="admin__menu">
                @for (enlace of grupo.enlaces; track enlace.url) {
                    <li class="admin__item">
                        <a class="admin__link" [routerLink]="enlace.url" routerLinkActive="admin__link--active">{{ enlace.nombre }}</a>
                    </li>
                }
            </ul>
        </section>
    }
</div>
