<article class="item-pelicula">
  <img class="item-pelicula__imagen" [src]="pelicula().imagen_url" [alt]="pelicula().nombre" />

  <div class="item-pelicula__info">
    <h3 class="item-pelicula__nombre">{{ pelicula().nombre }}</h3>
    <p class="item-pelicula__meta">
      <!--{{ pelicula().formato }} ·--> {{ pelicula().idioma.toUpperCase() }} · {{ pelicula().duracion_minutos }} min
    </p>
    <p class="item-pelicula__restriccion">
      {{ pelicula().restriccion_edad === 0 ? 'ATP' : '+' + pelicula().restriccion_edad }}
    </p>
  </div>

  <div class="item-pelicula__acciones">
    @if (esAdmin()) {
      <button
        type="button"
        class="item-pelicula__btn-modificar"
        (click)="onClickModificar()">
        Modificar
      </button>
    } @else {
      <a class="item-pelicula__btn-sinopsis" [routerLink]="['/peliculas', pelicula().id]">
        Sinopsis
      </a>
    }
  </div>
</article>
