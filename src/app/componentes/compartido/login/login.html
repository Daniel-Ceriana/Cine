<h1 class="titulo-pagina">Iniciar sesión</h1>



<div class="contenedor-form">

  <form (submit)="onSubmit($event)" novalidate>
    
    <div class="item">
      <section>
        <label>
          Email
        </label>
        <input type="email" [formField]="loginForm.email" [attr.aria-describedby]="loginForm.email().touched() && loginForm.email().invalid() ? 'error-email' : null" autocomplete="email" [class.campo-error]="errorMsg()" />
      </section>

      @if (loginForm.email().touched() && loginForm.email().invalid()) {
      <small class="error" role="alert" id="error-email">{{ loginForm.email().errors()[0].message }}</small>
      }
    </div>



    <div class="item">

      <section>

        <label>
          Contraseña
        </label>
        <input type="password" [formField]="loginForm.password" [attr.aria-describedby]="loginForm.password().touched() && loginForm.password().invalid() ? 'error-password' : null" autocomplete="current-password" [class.campo-error]="errorMsg()" />
      </section>
        
      @if (loginForm.password().touched() && loginForm.password().invalid()) {
      <small class="error" role="alert" id="error-password">{{ loginForm.password().errors()[0].message }}</small>
      }
    </div>

    @if (errorMsg()) {
      <p class="error aviso-error" role="alert">{{ errorMsg() }}</p>
    }

    <div class="item">

      <button type="submit" [disabled]="loginForm().submitting()">
        {{ loginForm().submitting() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>
    </div>
  </form>
</div>
