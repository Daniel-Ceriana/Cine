<!-- role="status": los lectores de pantalla lo anuncian cuando aparece, sin interrumpir -->
<div class="sin-conexion" role="status">
  @if (sinConexion()) {
    <p class="sin-conexion__texto">
      <strong>Sin conexión.</strong> No se puede ver la cartelera ni comprar hasta que vuelva internet.
    </p>
  }
</div>
