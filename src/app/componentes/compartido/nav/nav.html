<header class="cabecera">
    <nav class="navbar">
        <a class="navbar__logo" routerLink="/home">Picture House</a>

        <ul class="navbar__menu">
            @for (ruta of navService.rutas(); track ruta.url) {
                <li>
                    <a class="navbar__link" [routerLink]="ruta.url" routerLinkActive="navbar__link--activo">{{ ruta.nombre }}</a>
                </li>
            }
        </ul>
    </nav>
    <div class="marquesina"></div>
</header>
