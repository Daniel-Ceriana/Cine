<main class="container">
        <!-- section buscar -->
        <section class="ui-search-filter">
            <div class="ui-search-filter__search-container">

            </div>
            <div class="ui-search-filter__order">
                <h4 class="ui-search-filter__order--title" for="orden">ORDENAR POR</h4>
                <select class="ui-search-filter__order--select" name="orden" id="orden">

                    <label class="ui-search-filter__price-container--content__label min" for="minimo">MIN</label>
                    <input class="ui-search-filter__price-container--content__input-min" type="text" name="minimo" id="minimo" placeholder="0">
                    <label class="ui-search-filter__price-container--content__label max" for="maximo">MAX</label>
                    <input class="ui-search-filter__price-container--content__input-max" type="text" name="maximo" id="maximo" placeholder="0">

                    <input class="ui-search-filter__filter-container--checkbox" type="checkbox" name="nuevos" id="nuevos" value="NUEVOS">
                    <label class="ui-search-filter__filter-container--label" for="nuevos">NUEVOS</label>
                </div>
                <div>
                    <input class="ui-search-filter__filter-container--checkbox" type="checkbox" name="ofertas" id="ofertas" value="OFERTAS">

                </div>
                <div>
                    <input class="ui-search-filter__filter-container--checkbox" type="checkbox" name="especial" id="especial" value="EDICIÓN ESPECIAL">
                    <label class="ui-search-filter__filter-container--label" for="nuevos">EDICIÓN ESPECIAL</label>
                </div>
                <div>
                    <input class="ui-search-filter__filter-container--checkbox" type="checkbox" name="favoritos" id="favoritos" value="FAVORITOS">

        <section class="search-results">

                    <a class="card-item__link" href="../pages/item.html">

                        <div class="card-item__content">
                            <p class="card-item__licence">STAR WARS</p>

                </article>

                
            </div>
